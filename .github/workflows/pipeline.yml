name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: harbor.support.tools
  IMAGE_NAME: kubetty/kubetty
  NODE_VERSION: '22' # runner image bakes Node 22; setup-node resolves it from the toolcache (no job-time download)

jobs:
  # Stage 1: Validation
  validate:
    name: Validation
    runs-on: self-hosted-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test cross-cluster kubeconfig validation
        run: bash .github/actions/setup-kubeconfig-onprem/security-validation.test.sh

      # No actions/setup-go: the self-hosted runner image (runner:v21.1-arc2+)
      # bakes Go at /usr/local/go (1.26.x, GOTOOLCHAIN=local), which satisfies
      # server/go.mod's `go 1.24.0` floor. setup-go with any version spec missed
      # the runner tool cache and downloaded a Go tarball at job time
      # (taskforge-2849). No download fallback: fail loudly on a runner defect.
      - name: Verify baked Go
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 || { echo "::error::go is missing from this self-hosted runner. It must be pre-baked into the runner image - there is deliberately no download fallback. Fix the runner image."; exit 1; }
          go version
          go env GOROOT GOTOOLCHAIN GOCACHE GOMODCACHE

      - name: Check Go formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "ERROR: The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: server
        run: go vet ./...

      - name: Verify go.mod is tidy
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "ERROR: go.mod or go.sum not tidy" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        working-directory: web
        run: npm audit --audit-level=high
        continue-on-error: true

  # Stage 2: Test Matrix
  test-server:
    name: Server Tests
    runs-on: self-hosted-linux
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No actions/setup-go: the self-hosted runner image (runner:v21.1-arc2+)
      # bakes Go at /usr/local/go (1.26.x, GOTOOLCHAIN=local), which satisfies
      # server/go.mod's `go 1.24.0` floor. setup-go with any version spec missed
      # the runner tool cache and downloaded a Go tarball at job time
      # (taskforge-2849). No download fallback: fail loudly on a runner defect.
      - name: Verify baked Go
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 || { echo "::error::go is missing from this self-hosted runner. It must be pre-baked into the runner image - there is deliberately no download fallback. Fix the runner image."; exit 1; }
          go version
          go env GOROOT GOTOOLCHAIN GOCACHE GOMODCACHE

      - name: Run server tests
        working-directory: server
        env:
          KUBERNETES_SERVICE_HOST: ''
          KUBERNETES_SERVICE_PORT: ''
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check test coverage
        working-directory: server
        continue-on-error: true  # Coverage threshold is advisory while database tests are skipped in CI
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Test coverage: ${coverage}%"
          threshold=30
          if (( $(echo "$coverage < $threshold" | bc -l) )); then
            echo "WARNING: Coverage ${coverage}% is below threshold ${threshold}%"
            exit 1
          fi

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage
          path: server/coverage.out
          retention-days: 3

  test-web:
    name: Web Tests
    runs-on: self-hosted-linux
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm run test

      - name: Run linter
        working-directory: web
        run: npm run build

  # Stage 3: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: self-hosted-linux
    needs: [test-server, test-web]
    permissions:
      contents: read
      id-token: write          # GitHub OIDC -> Vault (keyless Harbor login)
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      runtime-image-digest: ${{ steps.image-identity.outputs.runtime-digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # binfmt from the Harbor Docker Hub proxy-cache (anonymous pull), pinned by tag + index
          # digest instead of docker.io/tonistiigi/binfmt:latest (cluster-services-1470).
          image: harbor.support.tools/dockerhub/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit from the Harbor Docker Hub proxy, pinned by index digest (cluster-services-1487)
          driver-opts: image=harbor.support.tools/dockerhub/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          # The ephemeral DFW runner can be starved when BuildKit executes the
          # UI, Go, and runtime stages concurrently. Keep the full image build,
          # but serialize BuildKit work so the runner remains responsive.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      # Keyless: mint a GitHub OIDC token and exchange it at Vault for the
      # repo-scoped Harbor robot (replaces org admin HARBOR_USERNAME/PASSWORD).
      - name: Vault login (GitHub OIDC) + Harbor robot
        if: github.event_name != 'pull_request'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions
          role: gha-kubetty
          jwtGithubAudience: https://github.com/SupportTools
          exportEnv: true
          secrets: |
            secret/data/harbor/kubetty-ci-robot username | HARBOR_ROBOT_USER ;
            secret/data/harbor/kubetty-ci-robot password | HARBOR_ROBOT_TOKEN

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.HARBOR_ROBOT_USER }}
          password: ${{ env.HARBOR_ROBOT_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # *_FALLBACK=none: every fetch a tier we run serves must come from it, or the build fails
          # instead of silently going upstream. apt -> fetch-cache (cluster-services-1494); npm ->
          # Verdaccio; browser zips, kubectl, helm, yq -> fetch-cache; Go modules -> Athens only,
          # no proxy.golang.org fallthrough (cluster-services-1496). See the Dockerfile header for
          # the remaining upstream-pinned fetches.
          build-args: |
            GO_VERSION=1.24.3
            NODE_MAJOR=20
            APT_FALLBACK=none
            NPM_FALLBACK=none
            FETCH_FALLBACK=none
            GOPROXY=https://goproxy.support.tools

      - name: Record pushed image identity
        id: image-identity
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-push-action returned an invalid image digest: '$IMAGE_DIGEST'"
            exit 1
          fi

          MANIFEST_JSON=$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --raw)
          MEDIA_TYPE=$(jq -er '.mediaType' <<<"$MANIFEST_JSON")
          case "$MEDIA_TYPE" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              RUNTIME_DIGEST=$(jq -er \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/amd64 manifest") end' \
                <<<"$MANIFEST_JSON")
              ;;
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              RUNTIME_DIGEST="$IMAGE_DIGEST"
              ;;
            *)
              echo "::error::unsupported image manifest media type: '$MEDIA_TYPE'"
              exit 1
              ;;
          esac
          if [[ ! "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a valid linux/amd64 runtime digest: '$RUNTIME_DIGEST'"
            exit 1
          fi

          echo "runtime-digest=${RUNTIME_DIGEST}" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Pushed ${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
          echo "OCI reference digest ${IMAGE_DIGEST}"
          echo "linux/amd64 runtime digest ${RUNTIME_DIGEST}"
          {
            echo "- OCI reference: \`${IMAGE_REPOSITORY}:sha-${SHORT_SHA}\` -> \`${IMAGE_DIGEST}\`"
            echo "- linux/amd64 runtime manifest: \`${RUNTIME_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage 4: Grype scan of the pushed linux/amd64 digest (taskforge-22081). deploy-production
  # needs it. Gate (operator decision 2026-11-20): fail on Critical findings that have a fix;
  # report High without failing.
  # In-line, not the org reusable SupportTools/ci-runners grype-scan.yml: this public repo
  # cannot call a private repo's reusable workflow (the run fails at load time, 0 jobs).
  image-scan:
    name: Image Scan (Grype)
    runs-on: self-hosted-linux
    needs: [build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # GitHub OIDC -> Vault (the build job's Harbor robot, pull only here)
    steps:
      - name: Checkout .grype.yaml (accepted findings, if any)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .grype.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Vault login (GitHub OIDC) + Harbor robot for grype
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions
          role: gha-kubetty
          jwtGithubAudience: https://github.com/SupportTools
          exportEnv: true
          secrets: |
            secret/data/harbor/kubetty-ci-robot username | GRYPE_REGISTRY_AUTH_USERNAME ;
            secret/data/harbor/kubetty-ci-robot password | GRYPE_REGISTRY_AUTH_PASSWORD

      # grype v0.117.0 is baked into the runner image. The vuln DB comes from the internal mirror
      # that Harbor's Grype scanner also uses, so CI and Harbor report the same findings.
      - name: Grype scan
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.runtime-image-digest }}
          GRYPE_REGISTRY_AUTH_AUTHORITY: ${{ env.REGISTRY }}
          GRYPE_DB_UPDATE_URL: https://s3.support.tools/grype-db/v6/latest.json
          GRYPE_DB_AUTO_UPDATE: 'true'
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no runtime digest from the build job: '$IMAGE'"; exit 1; }
          grype version
          for attempt in 1 2; do
            start=$(date +%s)
            rm -f "$RUNNER_TEMP/grype.json"
            if grype "registry:${IMAGE}" -o json --file "$RUNNER_TEMP/grype.json"; then
              echo "scan took $(( $(date +%s) - start ))s"
              exit 0
            fi
            echo "::warning::grype attempt ${attempt} failed after $(( $(date +%s) - start ))s (pull or DB fetch, not a finding)"
            sleep 15
          done
          echo "::error::grype could not scan ${IMAGE}; this is a transport failure, not a vulnerability"
          exit 1

      - name: Findings summary
        if: always()
        env:
          DIGEST: ${{ needs.build.outputs.runtime-image-digest }}
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/grype.json" ]] || { echo "::warning::no grype report; the scan did not finish"; exit 0; }
          {
            echo "### Grype: \`${DIGEST}\`"
            echo
            echo "| severity | findings | fix available |"
            echo "|---|---|---|"
            jq -r '
              ["Critical","High","Medium","Low","Negligible","Unknown"] as $order
              | [.matches[] | {sev: .vulnerability.severity, fixed: (.vulnerability.fix.state == "fixed"), key: "\(.vulnerability.id) \(.artifact.name)"}] | unique as $m
              | $order[] as $s
              | ($m | map(select(.sev == $s))) as $x
              | "| \($s) | \($x | length) | \($x | map(select(.fixed)) | length) |"' "$RUNNER_TEMP/grype.json"
            echo
            jq -r '[.ignoredMatches[]? | select(any(.appliedIgnoreRules[]; (.vulnerability // "") != ""))
              | "\(.vulnerability.id) \(.artifact.name) \(.artifact.version)"] | unique | length
              | "Not counted above: \(.) finding(s) accepted in the .grype.yaml baseline."' "$RUNNER_TEMP/grype.json"
            echo
            echo "#### Critical and High with a fix"
            echo
            echo "| severity | id | package | version | fixed in | type |"
            echo "|---|---|---|---|---|---|"
            jq -r '
              [.matches[] | select((.vulnerability.severity == "Critical" or .vulnerability.severity == "High") and .vulnerability.fix.state == "fixed")
               | [.vulnerability.severity, .vulnerability.id, .artifact.name, .artifact.version, (.vulnerability.fix.versions | join(", ")), .artifact.type]]
              | unique | sort_by(.[0], .[2]) | .[] | "| " + join(" | ") + " |"' "$RUNNER_TEMP/grype.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report
          path: ${{ runner.temp }}/grype.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate on fixable Critical
        run: |
          set -euo pipefail
          fixable() {
            jq -r --arg sev "$1" '[.matches[] | select(.vulnerability.severity == $sev and .vulnerability.fix.state == "fixed")
              | "\(.vulnerability.id) \(.artifact.name) \(.artifact.version) -> \(.vulnerability.fix.versions | join(", "))"] | unique | .[]' "$RUNNER_TEMP/grype.json"
          }
          HIGH=$(fixable High | wc -l | tr -d ' ')
          [[ "$HIGH" -eq 0 ]] || echo "::warning::${HIGH} High finding(s) have a fix (reported, not blocking); see the job summary"
          CRIT=$(fixable Critical)
          if [[ -n "$CRIT" ]]; then
            while read -r line; do echo "::error::fixable Critical: ${line}"; done <<<"$CRIT"
            echo "::error::production deploy is blocked until these are fixed or listed in .grype.yaml with a reason"
            exit 1
          fi
          echo "no Critical finding with a fix"

  # Stage 5: Helm Chart Validation
  helm-validate:
    name: Helm Chart Validation
    runs-on: self-hosted-linux
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Helm is baked into the runner image (ci-runners Dockerfile.arc2, checksum-pinned).
      # Do not download it per job: a job-time fetch from get.helm.sh failed twice on
      # 2026-10-01 (site IPv6 PMTU black hole) and skipped the deploy. See the TaskForge
      # CI runner contract, "No job-time downloads" (taskforge-2670).
      - name: Helm (baked into the runner image)
        run: |
          command -v helm >/dev/null || { echo "::error::helm is not on the runner image; fix ci-runners, do not download it here"; exit 1; }
          helm version --short

      - name: Lint Helm charts
        run: |
          # Gateway chart - default values
          helm lint deploy/helm-gateway/
          # Gateway chart - production values
          helm lint deploy/helm-gateway/ -f deploy/helm-gateway/values.prd.yaml
          # Project chart - requires projectId and sessionID
          helm lint deploy/helm-project/ \
            --set projectId=lint-test \
            --set env.sessionID=00000000-0000-0000-0000-000000000001

      - name: Validate Helm templates
        run: |
          helm template gateway deploy/helm-gateway/ > /dev/null
          helm template gateway deploy/helm-gateway/ -f deploy/helm-gateway/values.prd.yaml > /dev/null
          helm template project deploy/helm-project/ \
            --set projectId=template-test \
            --set env.sessionID=00000000-0000-0000-0000-000000000001 > /dev/null

      - name: Test gateway image references
        run: bash .github/scripts/test-helm-image-ref.sh

      # cluster-services-1534: the CI smoke service token is a DEV-only identity. Prod must never map
      # an Access service token to a user, so its render must not carry AUTH_ACCESS_SERVICE_TOKENS.
      - name: Production renders no Access service token mapping
        run: |
          set -euo pipefail
          if helm template gateway deploy/helm-gateway/ -f deploy/helm-gateway/values.prd.yaml | grep -q AUTH_ACCESS_SERVICE_TOKENS; then
            echo "::error::values.prd.yaml maps an Access service token (AUTH_ACCESS_SERVICE_TOKENS); service tokens are dev-only"
            exit 1
          fi
          helm template gateway deploy/helm-gateway/ -f deploy/helm-gateway/values.dev.yaml | grep -q 'AUTH_ACCESS_SERVICE_TOKENS' \
            || { echo "::error::values.dev.yaml lost the CI smoke service token mapping; the dev smoke gate would fail"; exit 1; }

      # The CI deployer may only manage these kinds (cluster-services
      # github-actions/supporttools/ci-deployers/kubetty-rbac.yaml). A new kind fails here, not as a Forbidden in deploy-dev.
      - name: Chart renders only kinds the CI deployer may manage
        run: |
          set -euo pipefail
          allowed="ClusterRole ConfigMap Deployment Ingress Role RoleBinding Service ServiceAccount"
          for env in dev prd; do
            for kind in $(helm template kubetty-gateway deploy/helm-gateway/ -f "deploy/helm-gateway/values.${env}.yaml" | sed -n 's/^kind: *//p' | sort -u); do
              if [[ " ${allowed} " != *" ${kind} "* ]]; then
                echo "::error::values.${env}.yaml renders kind ${kind}; grant it to kubetty-ci-deployer in cluster-services kubetty-rbac.yaml first, then add it here"
                exit 1
              fi
            done
          done

      - name: Package Helm charts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          helm package deploy/helm-gateway/ --destination ./helm-packages
          helm package deploy/helm-project/ --destination ./helm-packages

      - name: Upload Helm charts as artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-charts
          path: helm-packages/*.tgz
          retention-days: 3

  # Stage 6a: Deploy to Dev (health gate for production)
  # The dev gateway (kubetty-gateway-dev, https://kubetty-dev.support.tools) used to be
  # hand-deployed with `helm upgrade --reuse-values --set-string image.digest=...`, so dev
  # drifted and prd was the first place a build ran. Now every main/tag run deploys the SAME
  # build digest to dev first, health-gates it, and deploy-production needs this job: a dev
  # failure stops the prd deploy. Auth is the prd pattern: keyless GitHub OIDC -> Vault
  # kubernetes-onprem/creds/kubetty -> kubetty-ci-deployer (dev RBAC: cluster-services
  # github-actions/supporttools/ci-deployers/kubetty-rbac.yaml, cluster-services-1407).
  # values.dev.yaml + the three --set-string values below render byte-identical to the
  # hand-deployed revision 21 (verified 2026-11-15), so --reuse-values is not needed.
  deploy-dev:
    name: Deploy to Dev
    runs-on: self-hosted-linux
    needs: [build, helm-validate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write          # GitHub OIDC -> Vault (keyless, namespace-scoped K8s token)
    timeout-minutes: 45
    env:
      DEPLOY_TIMEOUT: 15m      # cold pull of the ~2.7 GB image (taskforge-2682)
      DEV_NAMESPACE: kubetty-gateway-dev
      # In-cluster Service: the runners are pods in a1-ops-prd, so this tests the gateway
      # itself rather than ingress/DNS/Cloudflare. /api/healthz pings the database.
      DEV_HEALTH_URL: http://gateway.kubetty-gateway-dev.svc:8080/api/healthz
    outputs:
      deployed-digest: ${{ steps.deploy.outputs.deployed-digest }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
      url: https://kubetty-dev.support.tools
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.30.3'

      - name: Helm (baked into the runner image)
        run: |
          command -v helm >/dev/null || { echo "::error::helm is not on the runner image; fix ci-runners, do not download it here"; exit 1; }
          helm version --short

      - name: Set up dev kubeconfig
        uses: ./.github/actions/setup-kubeconfig-onprem
        with:
          namespace: kubetty-gateway-dev

      - name: Resolve image tag
        id: extract-tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; TAG="${TAG#v}"
            RECOMMENDED="${TAG}"
          else
            TAG="latest"
            RECOMMENDED=$(git ls-remote --tags --refs origin 'v*' \
              | sed -n 's#.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
              | sort -V | tail -1)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "recommended=${RECOMMENDED}" >> "$GITHUB_OUTPUT"

      - name: Deploy to dev
        id: deploy
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.tag }}
          RECOMMENDED_TAG: ${{ steps.extract-tag.outputs.recommended }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::refusing to deploy an invalid image digest: '$IMAGE_DIGEST'"
            exit 1
          fi
          EXTRA_SET=()
          if [[ -n "${RECOMMENDED_TAG}" ]]; then
            EXTRA_SET+=(--set-string "env.RECOMMENDED_IMAGE_TAG=${RECOMMENDED_TAG}")
          fi
          echo "Previous dev image: $(kubectl get deployment gateway -n "$DEV_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo '<none>')"
          echo "Deploying ${IMAGE_REPOSITORY}@${IMAGE_DIGEST} (tag ${IMAGE_TAG}) to ${DEV_NAMESPACE}"
          # --atomic: a failed rollout rolls dev back and fails this job, which skips prd.
          helm upgrade --install kubetty-gateway deploy/helm-gateway/ \
            -n "$DEV_NAMESPACE" \
            -f deploy/helm-gateway/values.dev.yaml \
            --set-string image.repository="${IMAGE_REPOSITORY}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set-string image.digest="${IMAGE_DIGEST}" \
            "${EXTRA_SET[@]}" \
            --wait \
            --timeout="${DEPLOY_TIMEOUT}" \
            --history-max=20 \
            --atomic
          echo "deployed-digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Health gate
        env:
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/gateway -n "$DEV_NAMESPACE" --timeout="${DEPLOY_TIMEOUT}"
          DEPLOYED_IMAGE=$(kubectl get deployment gateway -n "$DEV_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::dev deployment image '$DEPLOYED_IMAGE' does not match '$EXPECTED_IMAGE'"
            exit 1
          fi
          # Every non-terminating pod must be Ready on the expected image.
          BAD=$(kubectl get pods -n "$DEV_NAMESPACE" -l app.kubernetes.io/name=kubetty-gateway -o json \
            | jq --arg e "$EXPECTED_IMAGE" '[.items[] | select(.metadata.deletionTimestamp == null) | select(.spec.containers[0].image != $e or (.status.containerStatuses[0].ready != true))] | length')
          if [[ "$BAD" -ne 0 ]]; then
            echo "::error::${BAD} dev gateway pod(s) not Ready on ${EXPECTED_IMAGE}"
            kubectl get pods -n "$DEV_NAMESPACE" -l app.kubernetes.io/name=kubetty-gateway -o wide || true
            exit 1
          fi
          # Application health: status=healthy and database=ok, 3 consecutive passes.
          ok=0
          for i in $(seq 1 30); do
            BODY=$(curl -sS -m 10 "$DEV_HEALTH_URL" 2>&1 || true)
            if jq -e '.status == "healthy" and .components.database == "ok"' >/dev/null 2>&1 <<<"$BODY"; then
              ok=$((ok + 1))
              [[ $ok -ge 3 ]] && { echo "✓ dev health: ${BODY}"; exit 0; }
            else
              ok=0
              echo "attempt ${i}: not healthy yet: ${BODY}"
            fi
            sleep 10
          done
          echo "::error::dev gateway did not report healthy at ${DEV_HEALTH_URL}; production deploy is blocked"
          exit 1

      - name: Roll dev back on failed health gate
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          kubectl logs deployment/gateway -n "$DEV_NAMESPACE" --tail=100 || true
          kubectl get events -n "$DEV_NAMESPACE" --sort-by='.lastTimestamp' | tail -20 || true
          PREV=$(helm history kubetty-gateway -n "$DEV_NAMESPACE" -o json | jq -r '[.[] | select(.status == "superseded")] | last | .revision // empty')
          if [[ -n "$PREV" ]]; then
            helm rollback kubetty-gateway "$PREV" -n "$DEV_NAMESPACE" --wait --timeout="${DEPLOY_TIMEOUT}"
            echo "Rolled dev back to revision ${PREV}"
          fi

      - name: Remove kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/kubeconfig}"

  # Stage 6a2: functional smoke against DEV (cluster-services-1534, operator decision 2026-11-19
  # "Automated smoke test before prod"). The dev health gate only proves the database answers;
  # this proves a real Access-authenticated session works end to end, through Cloudflare exactly
  # like a browser: GET /api/auth/me = 200 as the smoke user, the smoke user is restricted, and a
  # throwaway terminal tab echoes a shell-evaluated line over /ws. CI cannot do a Google login, so
  # it presents a Cloudflare Access SERVICE TOKEN that only the kubetty-dev Access app admits
  # (cluster-services network/cloudflare-tunnels/terraform access.tf kubetty_dev_smoke). KubeTTY dev
  # maps it (values.dev.yaml auth.access.serviceTokens) to kubetty-smoke, which may only open/close
  # its own tab on test-project. The token comes keylessly from Vault (GitHub OIDC, role gha-kubetty).
  # deploy-production needs this job: a smoke failure skips prod and rolls dev back.
  smoke-dev:
    name: Smoke Test Dev (Access + terminal)
    runs-on: self-hosted-linux
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write          # GitHub OIDC -> Vault (smoke token + namespace-scoped K8s token)
    timeout-minutes: 30
    env:
      DEV_NAMESPACE: kubetty-gateway-dev
      DEPLOY_TIMEOUT: 15m
      KUBETTY_SMOKE_URL: https://kubetty-dev.support.tools
      KUBETTY_SMOKE_USER: kubetty-smoke
      KUBETTY_SMOKE_PROJECT: test-project
      KUBETTY_SMOKE_TIMEOUT: 4m
    concurrency:
      group: deploy-dev          # no other run may redeploy dev while this run smoke-tests it
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify baked Go
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 || { echo "::error::go is missing from this self-hosted runner (no download fallback)"; exit 1; }
          go version

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.30.3'

      - name: Helm (baked into the runner image)
        run: |
          command -v helm >/dev/null || { echo "::error::helm is not on the runner image; fix ci-runners, do not download it here"; exit 1; }
          helm version --short

      - name: Set up dev kubeconfig
        uses: ./.github/actions/setup-kubeconfig-onprem
        with:
          namespace: kubetty-gateway-dev

      - name: Dev runs this build
        id: digest
        env:
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          DEPLOYED_IMAGE=$(kubectl get deployment gateway -n "$DEV_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::dev runs '$DEPLOYED_IMAGE', not this run's '$EXPECTED_IMAGE' (a newer run redeployed dev?); not smoke-testing someone else's build"
            exit 1
          fi
          echo "ours=true" >> "$GITHUB_OUTPUT"
          echo "✓ dev runs ${EXPECTED_IMAGE}"

      # Keyless: GitHub OIDC -> Vault jwt role gha-kubetty (policy gha-kubetty-read) -> the dev-only
      # Access service token. vault-action masks both values in the log.
      - name: Vault login (GitHub OIDC) + dev smoke Access token
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions
          role: gha-kubetty
          jwtGithubAudience: https://github.com/SupportTools
          exportEnv: true
          secrets: |
            secret/data/kubetty/ci-smoke-access-token client_id | CF_ACCESS_CLIENT_ID ;
            secret/data/kubetty/ci-smoke-access-token client_secret | CF_ACCESS_CLIENT_SECRET

      # server/cmd/kubetty-smoke. Fetch tier: Go modules from Athens only (GOPROXY=goproxy.support.tools,
      # no proxy.golang.org fallthrough), same as the image build.
      - name: Functional smoke (Access-authenticated /api/auth/me + terminal websocket echo)
        working-directory: server
        env:
          GOPROXY: https://goproxy.support.tools
          GOFLAGS: -mod=readonly
        run: go run ./cmd/kubetty-smoke

      - name: Roll dev back on failed smoke
        if: failure() && steps.digest.outputs.ours == 'true'
        run: |
          set -euo pipefail
          kubectl logs deployment/gateway -n "$DEV_NAMESPACE" --tail=100 || true
          PREV=$(helm history kubetty-gateway -n "$DEV_NAMESPACE" -o json | jq -r '[.[] | select(.status == "superseded")] | last | .revision // empty')
          if [[ -n "$PREV" ]]; then
            helm rollback kubetty-gateway "$PREV" -n "$DEV_NAMESPACE" --wait --timeout="${DEPLOY_TIMEOUT}"
            echo "Rolled dev back to revision ${PREV}; production deploy is skipped"
          fi

      - name: Remove kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/kubeconfig}"

  # Stage 6b: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted-linux
    # dev must deploy, pass its health gate AND the functional smoke first (cluster-services-1534);
    # the image must have no Critical finding with a fix (taskforge-22081)
    needs: [build, helm-validate, deploy-dev, smoke-dev, image-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write          # GitHub OIDC -> Vault (keyless, namespace-scoped K8s token)
    # The runtime image is ~2.7 GB and a cold pull on an a1-ops-prd node takes
    # ~8 minutes (taskforge-2682). Every wait in this job that can span an image
    # pull uses DEPLOY_TIMEOUT, sized well above the measured cold pull, so a
    # slow-but-healthy rollout is not reported as a failure and rolled back.
    # Keep the chart's progressDeadlineSeconds (values.prd.yaml) >= this.
    timeout-minutes: 60
    env:
      DEPLOY_TIMEOUT: 15m
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://kubetty.support.tools
    steps:
      - name: Validate semantic version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Production tag must be clean semantic version (v1.2.3)"
            echo "Got: $TAG"
            echo ""
            echo "CLAUDE.md rule: Semantic versioning only - No suffixes like -rc, -beta, -alpha"
            exit 1
          fi
          echo "✓ Valid semantic version: $TAG"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.30.3'

      # Helm is baked into the runner image (ci-runners Dockerfile.arc2, checksum-pinned).
      # Do not download it per job: a job-time fetch from get.helm.sh failed twice on
      # 2026-10-01 (site IPv6 PMTU black hole) and skipped the deploy. See the TaskForge
      # CI runner contract, "No job-time downloads" (taskforge-2670).
      - name: Helm (baked into the runner image)
        run: |
          command -v helm >/dev/null || { echo "::error::helm is not on the runner image; fix ci-runners, do not download it here"; exit 1; }
          helm version --short

      # DFW runners live in stackeye-ci-dfw01, so their in-cluster API endpoint
      # and projected CA cannot be used for the a1-ops-prd deployment.
      - name: Set up production kubeconfig
        uses: ./.github/actions/setup-kubeconfig-onprem
        with:
          namespace: kubetty-gateway-prd

      - name: Extract image tag
        id: extract-tag
        run: |
          # Use tag version if this is a tag push, otherwise use 'latest'
          # For semver tags (v0.6.0), docker/metadata-action creates tag without 'v' prefix (0.6.0)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip 'v' prefix to match docker/metadata-action semver pattern
            TAG="${TAG#v}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying version: ${TAG}"

          # RECOMMENDED_IMAGE_TAG is the version the admin UI offers for a project
          # upgrade, and the upgrade API accepts only semver tags. It used to be a
          # hand-edited constant in values.prd.yaml (v1.1.6 while projects ran
          # v1.13-v1.15), so the UI offered a downgrade and per-project sandboxes
          # stayed on images that still trusted emSign ECC Root CA - G3
          # (cluster-services-1333). Derive it from the release instead: the tag
          # being deployed, or on a main push the newest vX.Y.Z tag in the repo.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RECOMMENDED="${TAG}"
          else
            RECOMMENDED=$(git ls-remote --tags --refs origin 'v*' \
              | sed -n 's#.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
              | sort -V | tail -1)
          fi
          echo "recommended=${RECOMMENDED}" >> "$GITHUB_OUTPUT"
          echo "Recommended project image tag: ${RECOMMENDED:-<unchanged, values file>}"

      - name: Deploy to production
        id: deploy
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.tag }}
          RECOMMENDED_TAG: ${{ steps.extract-tag.outputs.recommended }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          RUNTIME_IMAGE_DIGEST: ${{ needs.build.outputs.runtime-image-digest }}
          DEV_DIGEST: ${{ needs.deploy-dev.outputs.deployed-digest }}
        run: |
          set -euo pipefail
          EXTRA_SET=()
          if [[ -n "${RECOMMENDED_TAG}" ]]; then
            EXTRA_SET+=(--set-string "env.RECOMMENDED_IMAGE_TAG=${RECOMMENDED_TAG}")
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::refusing to deploy an invalid image digest: '$IMAGE_DIGEST'"
            exit 1
          fi
          if [[ ! "$RUNTIME_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::refusing to deploy without a valid linux/amd64 runtime digest: '$RUNTIME_IMAGE_DIGEST'"
            exit 1
          fi
          EXPECTED_IMAGE="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          if [[ "$IMAGE_DIGEST" != "$DEV_DIGEST" ]]; then
            echo "::error::prd digest '$IMAGE_DIGEST' is not the digest dev was health-gated on: '$DEV_DIGEST'"
            exit 1
          fi
          echo "Same digest as health-gated dev: ${DEV_DIGEST}"

          # Capture current revision for potential rollback
          CURRENT_REVISION=$(helm history kubetty-gateway -n kubetty-gateway-prd --max 1 -o json 2>/dev/null | jq -r '.[0].revision // "0"') || CURRENT_REVISION="0"
          PREVIOUS_IMAGE=$(kubectl get deployment gateway -n kubetty-gateway-prd -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          PREVIOUS_REPLICA_SET=$(kubectl get pods -n kubetty-gateway-prd \
            -l app.kubernetes.io/name=kubetty-gateway -o json 2>/dev/null \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null and .status.containerStatuses[0].ready == true) | .metadata.ownerReferences[]? | select(.kind == "ReplicaSet") | .name] | first // ""') \
            || PREVIOUS_REPLICA_SET=""
          {
            echo "current-revision=${CURRENT_REVISION}"
            echo "previous-image=${PREVIOUS_IMAGE}"
            echo "previous-replica-set=${PREVIOUS_REPLICA_SET}"
            echo "expected-image=${EXPECTED_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying version: ${IMAGE_TAG}"
          echo "Deploying OCI reference digest: ${IMAGE_DIGEST}"
          echo "Expected linux/amd64 runtime digest: ${RUNTIME_IMAGE_DIGEST}"
          echo "Current revision: ${CURRENT_REVISION}"
          echo "Previous image: ${PREVIOUS_IMAGE:-<none>}"
          echo "Previous ReplicaSet: ${PREVIOUS_REPLICA_SET:-<none>}"

          helm upgrade --install kubetty-gateway deploy/helm-gateway/ \
            -n kubetty-gateway-prd \
            -f deploy/helm-gateway/values.prd.yaml \
            --set-string image.repository="${IMAGE_REPOSITORY}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set-string image.digest="${IMAGE_DIGEST}" \
            "${EXTRA_SET[@]}" \
            --wait \
            --timeout="${DEPLOY_TIMEOUT}" \
            --history-max=20 \
            --atomic

      - name: Verify deployment
        env:
          EXPECTED_IMAGE: ${{ steps.deploy.outputs.expected-image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          RUNTIME_IMAGE_DIGEST: ${{ needs.build.outputs.runtime-image-digest }}
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous-image }}
          PREVIOUS_REPLICA_SET: ${{ steps.deploy.outputs.previous-replica-set }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/gateway \
            -n kubetty-gateway-prd \
            --timeout="${DEPLOY_TIMEOUT}"

          # Wait only on pods that are not being deleted. Right after the
          # rollout the old ReplicaSet's pod is still Terminating; a label-
          # selector wait picks it up, blocks on it until it is gone, and then
          # times out the whole step (2026-10-05 run 37257107122 rolled back a
          # healthy deploy this way). cluster-services-1008.
          mapfile -t LIVE_PODS < <(kubectl get pods -n kubetty-gateway-prd \
            -l app.kubernetes.io/name=kubetty-gateway -o json \
            | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | "pod/" + .metadata.name')
          if [[ "${#LIVE_PODS[@]}" -eq 0 ]]; then
            echo "ERROR: no non-terminating gateway pods after rollout"
            exit 1
          fi
          kubectl wait --for=condition=ready "${LIVE_PODS[@]}" \
            -n kubetty-gateway-prd \
            --timeout=300s

          DEPLOYED_IMAGE=$(kubectl get deployment gateway -n kubetty-gateway-prd \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "ERROR: Deployment image '$DEPLOYED_IMAGE' does not match '$EXPECTED_IMAGE'"
            exit 1
          fi

          PODS_JSON=$(kubectl get pods -n kubetty-gateway-prd \
            -l app.kubernetes.io/name=kubetty-gateway -o json)
          UNEXPECTED_READY=$(jq --arg expected "$EXPECTED_IMAGE" \
            '[.items[] | select(.metadata.deletionTimestamp == null and .status.containerStatuses[0].ready == true and .spec.containers[0].image != $expected)] | length' \
            <<<"$PODS_JSON")
          if [[ "$UNEXPECTED_READY" -ne 0 ]]; then
            echo "ERROR: ${UNEXPECTED_READY} Ready gateway pod(s) use an unexpected image"
            exit 1
          fi

          mapfile -t READY_PODS < <(jq -r --arg expected "$EXPECTED_IMAGE" \
            '.items[] | select(.metadata.deletionTimestamp == null and .status.containerStatuses[0].ready == true and .spec.containers[0].image == $expected) | [.metadata.name, ([.metadata.ownerReferences[]? | select(.kind == "ReplicaSet") | .name] | first // ""), .status.containerStatuses[0].imageID] | @tsv' \
            <<<"$PODS_JSON")
          if [[ "${#READY_PODS[@]}" -eq 0 ]]; then
            echo "ERROR: No Ready gateway pod uses '$EXPECTED_IMAGE'"
            exit 1
          fi

          ACTIVE_REPLICA_SET=""
          for row in "${READY_PODS[@]}"; do
            IFS=$'\t' read -r pod replica_set image_id <<<"$row"
            # containerd reports imageID as the digest the image was pulled by.
            # The chart pins the multi-arch index digest, so a correct pod reports
            # IMAGE_DIGEST; a node that resolved the platform manifest reports
            # RUNTIME_IMAGE_DIGEST. Both identify this build; anything else does not.
            if [[ "$image_id" != *@"$IMAGE_DIGEST" && "$image_id" != *@"$RUNTIME_IMAGE_DIGEST" ]]; then
              echo "ERROR: Pod '$pod' runtime imageID '$image_id' matches neither index digest '$IMAGE_DIGEST' nor linux/amd64 digest '$RUNTIME_IMAGE_DIGEST'"
              exit 1
            fi
            ACTIVE_REPLICA_SET="$replica_set"
            echo "Verified pod ${pod}: ${image_id}"
          done

          if [[ -z "$ACTIVE_REPLICA_SET" ]]; then
            echo "ERROR: Ready gateway pod is not owned by a ReplicaSet"
            exit 1
          fi

          if [[ -n "$PREVIOUS_IMAGE" && "$PREVIOUS_IMAGE" != "$EXPECTED_IMAGE" && "$ACTIVE_REPLICA_SET" == "$PREVIOUS_REPLICA_SET" ]]; then
            echo "ERROR: Image changed but the active ReplicaSet did not"
            exit 1
          fi

          echo "✓ Deployment image: ${DEPLOYED_IMAGE}"
          echo "✓ Active ReplicaSet: ${ACTIVE_REPLICA_SET}"
          echo "✓ ${#READY_PODS[@]} Ready gateway pod(s) run the build digest"

      - name: Run smoke tests
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n kubetty-gateway-prd -l app.kubernetes.io/name=kubetty-gateway

          echo ""
          echo "=== Service Endpoints ==="
          kubectl get svc -n kubetty-gateway-prd

          echo ""
          echo "=== Deployment Status ==="
          kubectl rollout status deployment/gateway -n kubetty-gateway-prd --timeout=60s

      - name: Rollback on failure
        if: failure() && steps.deploy.outputs.current-revision != '' && steps.deploy.outputs.current-revision != '0'
        env:
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous-image }}
        run: |
          set -euo pipefail
          echo "❌ PRODUCTION DEPLOYMENT FAILED ❌"

          # A rollback while the new pod is still pulling the image cannot help:
          # it replaces a healthy-but-slow rollout with another one that also
          # times out (taskforge-2682). If any gateway pod is still in
          # ContainerCreating/PodInitializing (no pull error), leave the rollout
          # alone; the job stays red so a human looks at it.
          PULLING=$(kubectl get pods -n kubetty-gateway-prd \
            -l app.kubernetes.io/name=kubetty-gateway -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.state.waiting.reason // empty | select(. == "ContainerCreating" or . == "PodInitializing")] | length') \
            || PULLING=0
          if [[ "${PULLING:-0}" -gt 0 ]]; then
            echo "::warning::${PULLING} gateway pod(s) still ContainerCreating (image pull in progress); skipping automatic rollback"
            kubectl get pods -n kubetty-gateway-prd -l app.kubernetes.io/name=kubetty-gateway -o wide || true
            exit 0
          fi

          echo "Attempting automatic rollback to revision ${{ steps.deploy.outputs.current-revision }}..."

          helm rollback kubetty-gateway ${{ steps.deploy.outputs.current-revision }} -n kubetty-gateway-prd \
            --wait --timeout="${DEPLOY_TIMEOUT}"

          if [[ -n "$PREVIOUS_IMAGE" ]]; then
            ROLLED_BACK_IMAGE=$(kubectl get deployment gateway -n kubetty-gateway-prd \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [[ "$ROLLED_BACK_IMAGE" != "$PREVIOUS_IMAGE" ]]; then
              echo "ERROR: Rollback image '$ROLLED_BACK_IMAGE' does not match prior image '$PREVIOUS_IMAGE'"
              exit 1
            fi
            echo "✓ Rollback restored image: ${ROLLED_BACK_IMAGE}"
          fi

          # Verify rollback succeeded
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=kubetty-gateway \
            -n kubetty-gateway-prd \
            --timeout=180s || echo "⚠️  WARNING: Rollback verification failed - manual intervention required"

          echo "Rollback completed. Please investigate the failure before attempting another deployment."

      - name: Collect failure logs
        if: failure()
        run: |
          echo "=== Failed Pod Logs ==="
          for pod in $(kubectl get pods -n kubetty-gateway-prd -l app.kubernetes.io/name=kubetty-gateway -o name | head -5); do
            echo "Logs from ${pod}:"
            kubectl logs ${pod} -n kubetty-gateway-prd --tail=100 || echo "Could not retrieve logs for ${pod}"
            echo "---"
          done

          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n kubetty-gateway-prd --sort-by='.lastTimestamp' | tail -30

      - name: Remove kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/kubeconfig}"
