# KubeTTY Gateway - Development Environment
# Deploy to kubetty-gateway-dev namespace (mirrors kubetty-shared in prod)

image:
  repository: harbor.support.tools/kubetty/kubetty
  tag: "v1.1.6"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - harbor-supporttools

deploymentId: kubetty-gateway-dev

# Debug logging for development
env:
  LOG_LEVEL: debug
  # Use semantic version for recommended upgrades (not floating tags like "dev")
  RECOMMENDED_IMAGE_TAG: "v0.8.0"

# Authentication - Cloudflare Access SSO (cluster-services-1299), dev's own
# Access app "owner (google): kubetty-dev.support.tools" (separate AUD from prod).
auth:
  mode: cloudflare-access
  access:
    teamDomain: https://supporttools.cloudflareaccess.com
    aud: 58a946efbe8d7ae906c73b639b039600469a4f6fdd41d4562ff747c669cf48a8
    users: mmattox@mattoxengineering.com=mmattox
    # CI smoke (cluster-services-1534): the kubetty-dev-only Access service token (cluster-services
    # network/cloudflare-tunnels/terraform access.tf kubetty_dev_smoke; secret in Vault
    # secret/kubetty/ci-smoke-access-token) maps to the restricted user kubetty-smoke, which may only
    # open/close its own terminal tab on test-project. <client_id>=<username>:<project>. Never in prd.
    serviceTokens: 74db6234cffb8c621b7e6616192f810d.access=kubetty-smoke:test-project
  jwtSecretSecret:
    name: "kubetty-gateway-dev-auth"
    key: jwt-secret
  issuer: kubetty-dev
  accessTTL: 1h
  refreshTTL: 720h
  cookieDomain: ""
  cookieSecure: false

# Dev project catalog - empty for dev (uses dynamic projects only)
catalog:
  inline: |
    projects: []

# Database - local CNPG cluster in same namespace
cnpg:
  host: kubetty-db-rw.kubetty-gateway-dev.svc
  port: 5432
  database: kubetty
  userSecret: kubetty-postgres-user
  usernameKey: username
  passwordKey: password

service:
  type: ClusterIP
  port: 8080

# Dev ingress with separate hostname
ingress:
  enabled: true
  className: nginx
  tlsSecret: star-support-tools-tls
  hosts:
    - host: kubetty-dev.support.tools
      path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  projectNamespaces:
    - kubetty-projects-dev
  # Suffix for cluster-scoped resources to avoid conflicts with prod
  clusterResourceSuffix: "-dev"

# Project controller for dev
controller:
  enabled: true
  # Target namespace for dynamically managed projects (single-namespace mode)
  projectsNamespace: "kubetty-projects-dev"
  # Prefix for all Kubernetes resources created by controller
  resourcePrefix: "kubetty-project-"
  reconcileInterval: 30s
  healthCheckInterval: 60s
  envSecretName: env-secrets
  imagePullSecrets: "harbor-supporttools"

# Lower resources for dev
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

podAnnotations: {}

prometheus:
  scrape:
    enabled: true
    path: /metrics
    port: 8080
  podMonitor:
    enabled: false
